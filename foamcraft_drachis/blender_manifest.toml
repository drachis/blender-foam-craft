schema_version = "1.0.0"

id = "foamcraft_drachis"
version = "0.1.0"
name = "FoamCraft"
tagline = "Bevel angles, darts and cut patterns for foam panels"
maintainer = "Toli <drachis@gmail.com>"
type = "add-on"

website = "https://github.com/drachis/blender-foam-craft"
support = "https://github.com/drachis/blender-foam-craft/issues"
blender_version_min = "5.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

tags = ["Modeling", "Mesh"]

[permissions]
files = "Write cut-pattern SVG files and a diagnostic log"

[build]
# Keep build artefacts and editor leftovers out of the shipped package. The
# working directory is junctioned straight into Blender's user_default
# extensions repo for development, so __pycache__ accumulates in it.
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  ".DS_Store",
  "/.git/",
]
